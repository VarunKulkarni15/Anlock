<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGleam" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#091424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05080d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Plate -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGleam)" stroke="url(#specularRim)" stroke-width="6"/>

  <!-- Specular inner rim -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Lock Body -->
  <g filter="url(#cyanGlow)" transform="translate(136, 136)">
    <!-- Shackle -->
    <path d="M48 110 V70 C48 30 78 0 120 0 C162 0 192 30 192 70 V110" fill="none" stroke="#22d3ee" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Lock Base -->
    <rect x="20" y="100" width="200" height="140" rx="36" fill="#0c1728" stroke="#00f2fe" stroke-width="12"/>
    
    <!-- Fingerprint / Biometric Center Dot -->
    <circle cx="120" cy="170" r="16" fill="#00f2fe"/>
    <path d="M120 170 V196" stroke="#00f2fe" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
